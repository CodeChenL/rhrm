[package]
name = "bt-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
eframe = "0.31"
egui = "0.31"

# 蓝牙 - bluest
bluest = "0.4"

# 异步
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "rt"] }
futures-lite = "2"

# 日志
log = "0.4"
env_logger = "0.11"

# 时间
chrono = "0.4"

[profile.release]
lto = true
opt-level = "z"
strip = true
