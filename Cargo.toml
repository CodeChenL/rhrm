[package]
name = "bt-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
eframe = { version = "0.33.3", features = ["glow"]}
egui = "0.33.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# 蓝牙 - bluest
bluest = "0.4"

# 异步
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "rt", "time"] }
futures-lite = "2"

# 日志
log = "0.4"
env_logger = "0.11"

# 错误处理
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# 时间
chrono = "0.4"

# 共享内存
shared_memory = "0.12"

[profile.release]
lto = true
opt-level = "z"
strip = true
